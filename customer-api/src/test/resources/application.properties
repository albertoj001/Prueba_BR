# Configuración para el perfil de pruebas (@QuarkusTest)
# Usa H2 en memoria para aislar las pruebas de cualquier base de datos real

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
quarkus.datasource.username=sa
quarkus.datasource.password=

quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=false

# Deshabilitar Swagger UI en tests
quarkus.swagger-ui.always-include=false

# REST client para tests (se mockea con @InjectMock, pero necesita URL base)
quarkus.rest-client."com.empresa.customer.client.RestCountriesClient".url=https://restcountries.com
