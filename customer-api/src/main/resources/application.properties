quarkus.application.name=customer-api
quarkus.application.version=1.0.0

# Datasource: SQLite en archivo para dev, H2 en memoria para test, PostgreSQL en prod
%dev.quarkus.datasource.db-kind=other
%dev.quarkus.datasource.jdbc.driver=org.sqlite.JDBC
%dev.quarkus.datasource.jdbc.url=jdbc:sqlite:customerdb.db
%dev.quarkus.datasource.jdbc.min-size=1
%dev.quarkus.datasource.jdbc.max-size=1
%dev.quarkus.hibernate-orm.dialect=org.hibernate.community.dialect.SQLiteDialect

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:customerdb}
%prod.quarkus.datasource.username=${DB_USER:postgres}
%prod.quarkus.datasource.password=${DB_PASSWORD:secret}

# dev actualiza el schema sin borrar datos; test recrea desde cero; prod solo valida
%dev.quarkus.hibernate-orm.database.generation=update
%test.quarkus.hibernate-orm.database.generation=drop-and-create
%prod.quarkus.hibernate-orm.database.generation=validate

quarkus.hibernate-orm.log.sql=false

# OpenAPI / Swagger UI
quarkus.smallrye-openapi.info-title=Customer Management API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=API RESTful para la gestión de clientes. \
  Permite operaciones CRUD sobre clientes con validación de datos e integración con restcountries.com.
quarkus.smallrye-openapi.info-contact-name=Equipo Backend
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/swagger-ui

# REST client a restcountries.com
quarkus.rest-client.restcountries.url=https://restcountries.com
quarkus.rest-client.restcountries.scope=jakarta.enterprise.context.ApplicationScoped

quarkus.http.port=8080

quarkus.log.level=INFO
quarkus.log.category."com.empresa".level=DEBUG
